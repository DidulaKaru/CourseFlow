services:
  db:
    image: pgvector/pgvector:pg16
    container_name: courseflow_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CourseFlow5678db}
      POSTGRES_DB: ${POSTGRES_DB:-courseflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-courseflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot runs initdb, which can exceed 25s on slower machines; failures
      # during this window don't count, so `docker compose up` works first time.
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courseflow_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CourseFlow5678db}@db:5432/${POSTGRES_DB:-courseflow}
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000"]'
      PROJECT_NAME: CourseFlow API
      VERSION: 1.0.0
      API_V1_STR: /api/v1
    volumes:
      - ./backend:/app
      - ./frontend/src/data:/frontend/src/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      # Root context: frontend is an npm workspace and the lockfile lives at the repo root.
      context: .
      dockerfile: frontend/Dockerfile
    container_name: courseflow_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite dev-server proxy target for /api (container localhost is not the backend).
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      # Keep the Linux node_modules installed in the image; never shadow them with host files.
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  ollama:
    image: ollama/ollama:latest
    container_name: courseflow_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - full
      - sprint2

volumes:
  pgdata:
  ollama_data:
