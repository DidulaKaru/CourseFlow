# CF-221: optional NVIDIA GPU acceleration for the Ollama runtime.
# Requires an NVIDIA GPU + NVIDIA Container Toolkit (Docker Desktop: WSL2 GPU support).
# Usage:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Without this file Ollama runs multi-threaded on the CPU, so `docker compose up`
# works on machines that have no GPU.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
