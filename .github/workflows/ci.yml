name: CourseFlow Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code (full history for base-ref diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Invariant Checks (catalog, UI aesthetic, canvas camera, store, tests)
        # Executable form of agents.md / CLAUDE.md. Diffs against the PR base so catalog
        # facts cannot change silently and fix/ branches must ship a regression test.
        env:
          CF_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: python scripts/check_invariants.py

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Verification
        # `tsc -b` follows the project references. A bare `tsc --noEmit` at the repo
        # root has `files: []` and checks nothing.
        run: npm run typecheck

      - name: Linter Check
        run: npm run lint

      - name: Frontend Test Suite (Vitest)
        run: npm test

      - name: Production Bundle Verification
        run: npm run build

  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r backend/requirements.txt

      - name: Python Linter Check (Ruff)
        run: ruff check backend/

      - name: Automated Backend Tests (Pytest + Coverage >= 85%)
        run: pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=85
