name: CourseFlow Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Verification
        run: npx tsc --noEmit

      - name: Linter Check
        run: npm run lint

      - name: Frontend Test Suite (Vitest)
        run: npm test

      - name: Production Bundle Verification
        run: npm run build

  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r backend/requirements.txt

      - name: Python Linter Check (Ruff)
        run: ruff check backend/

      - name: Automated Backend Tests (Pytest)
        run: pytest backend/tests
