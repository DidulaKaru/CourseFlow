name: CourseFlow Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Verification
        # `tsc -b` follows the project references. A bare `tsc --noEmit` at the repo
        # root has `files: []` and checks nothing.
        run: npm run typecheck

      - name: Linter Check
        run: npm run lint

      - name: Frontend Test Suite (Vitest)
        run: npm test

      - name: Production Bundle Verification
        run: npm run build

  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r backend/requirements.txt

      - name: Python Linter Check (Ruff)
        run: ruff check backend/

      - name: Automated Backend Tests (Pytest)
        run: pytest backend/tests
