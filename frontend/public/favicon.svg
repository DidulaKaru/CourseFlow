<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Skyrim Celestial Constellation Star Node -->
  <rect width="64" height="64" rx="12" fill="#030508"/>
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric Glow Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#starGlow)"/>

  <!-- Hairline Constellation Ring -->
  <circle cx="32" cy="32" r="20" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.75" stroke-dasharray="2 3"/>

  <!-- Four-Point Celestial Star Beams -->
  <!-- Vertical Beam -->
  <path d="M32 6 L35 32 L32 58 L29 32 Z" fill="url(#starBeam)"/>
  <!-- Horizontal Beam -->
  <path d="M6 32 L32 35 L58 32 L32 29 Z" fill="url(#starBeam)"/>

  <!-- Diagonal Sub-Beams -->
  <path d="M18 18 L32 30 L46 46 L30 32 Z" fill="#38BDF8" fill-opacity="0.4"/>
  <path d="M46 18 L32 30 L18 46 L34 32 Z" fill="#38BDF8" fill-opacity="0.4"/>

  <!-- Central Diamond Star Core -->
  <polygon points="32,24 40,32 32,40 24,32" fill="#FFFFFF"/>
  <polygon points="32,27 37,32 32,37 27,32" fill="#00F0FF"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
